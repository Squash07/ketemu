services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ketemu
      POSTGRES_USER: ${DB_USER:-ketemu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ketemu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ketemu} -d ketemu"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ketemu
      DB_USER: ${DB_USER:-ketemu}
      DB_PASSWORD: ${DB_PASSWORD:-ketemu}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ketemu123}
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
